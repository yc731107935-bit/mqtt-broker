name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck doxygen

      - name: Build (host, debug)
        run: make CROSS_COMPILE= MODE=debug

      - name: Build (host, release)
        run: make clean && make CROSS_COMPILE= MODE=release

      - name: Unit tests
        run: make test CROSS_COMPILE=

      - name: Static analysis (cppcheck)
        run: make lint

      - name: Documentation (Doxygen)
        run: make docs
        env:
          DOXYGEN_WARN_AS_ERROR: YES

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/generated/html
          retention-days: 7
